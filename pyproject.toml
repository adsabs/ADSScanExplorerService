[project]
name = "scan_explorer_service"
version = "0.0.1"
description = "ADS Scan Explorer Service"
authors = [{ name = "ADS Team", email = "adshelp@cfa.harvard.edu" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "adsmutils @ git+https://github.com/adsabs/ADSMicroserviceUtils.git@v2.0.0",
    "Flask-Limiter==3.8.0",
    "Flask-Compress==1.24",
    "iiif-prezi==0.3.0",
    "SQLAlchemy-Utils==0.42.1",
    "Jinja2==3.1.6",
    "markupsafe==3.0.3",
    "itsdangerous==2.2.0",
    "werkzeug==2.3.8",
    "psycopg2-binary==2.9.12",
    "opensearch-py==3.2.0",
    "alembic==1.19.1",
    "img2pdf==0.6.3",
    "appmap==3.0.1",
    "boto3==1.43.67",
    "redis==5.0.8"
]

[project.optional-dependencies]
dev = [
    "Flask-Testing==0.8.1",
    "testing.postgresql==1.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.15.4"
]

[build-system]
requires = ["setuptools>=62.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scan_explorer_service*"]
exclude = ["scan_explorer_service.tests*"]

[tool.pytest.ini_options]
addopts = "--cov=scan_explorer_service --cov-report=term-missing"
testpaths = ["scan_explorer_service/tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
